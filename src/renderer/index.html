<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Dark before the stylesheets arrive: a reload (the View menu, F5, the
       table screen opening) otherwise paints Chromium's white page for a
       frame or two before style.css lands, a white flicker on Windows. The
       colour is --background in style.css. -->
  <meta name="color-scheme" content="dark">
  <style>html { background: #0a0817; color-scheme: dark; }</style>
  <!-- img-src allows https and http so campaign cover art can come from the
       hosts the player has campaigns on (the device world is plain http).
       frame-src does the same for an addon's board view, which the table
       frames from the host it is talking to (the server's
       src/app/campaigns/[campaignId]/AddonBoardView.tsx). The frame is
       sandboxed with scripts only, so it runs with no access to this page. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src https: http:; font-src 'self'; frame-src https: http:">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Dungeon Master</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./controls.css">
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <!-- Dust motes under the stars and the topographic lines, as on the
       server (its layout lays the same layer). -->
  <div class="ambient-dust" aria-hidden="true"></div>
  <canvas id="topo" aria-hidden="true"></canvas>
  <div id="app"></div>
  <!-- Module scripts: tsc emits a trailing "export {}" for files that only
       import types, which a classic script rejects with a syntax error. -->
  <script type="module" src="./topo.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
