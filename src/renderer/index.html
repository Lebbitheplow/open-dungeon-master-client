<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- img-src allows https and http so campaign cover art can come from the
       hosts the player has campaigns on (the device world is plain http). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: https: http:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Dungeon Master</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./controls.css">
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <canvas id="topo" aria-hidden="true"></canvas>
  <div id="app"></div>
  <!-- Module scripts: tsc emits a trailing "export {}" for files that only
       import types, which a classic script rejects with a syntax error. -->
  <script type="module" src="./topo.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
