appId: com.opendungeonmaster.client
productName: Open Dungeon Master
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: vendor/server
    to: server
  # The window and taskbar icon at runtime (src/main/window.ts); the
  # platform icons below are derived from the same file by electron-builder.
  - from: build/icon.png
    to: icon.png
asar: true
# One 1024px source, rendered from build/icon.svg by scripts/make-icons.mjs;
# electron-builder converts it to .icns and .ico itself.
icon: build/icon.png
# Releases live on GitHub; the in-app updater reads the latest release's
# latest.yml (NSIS) and latest-linux.yml (AppImage) straight from its
# assets, no token needed once the repo is public. Other targets (deb, rpm,
# tar.gz, dmg) ignore the feed; their installs are notify-only in the app.
# opendungeonmaster.com links here rather than hosting binaries itself.
publish:
  provider: github
  owner: Lebbitheplow
  repo: open-dungeon-master-client
# Registers odm:// on macOS (Info.plist), Windows (installer) and Linux
# (.desktop MimeType), so invite links open the app.
protocols:
  - name: Open Dungeon Master invite
    schemes: [odm]
# The default AppImage runtime dynamically links libfuse.so.2, which modern
# distros (Fedora 41+, Ubuntu 24.04+) no longer ship; toolset 1.0.3 packs the
# static type2 runtime that works with plain fuse3/kernel fuse.
toolsets:
  appimage: "1.0.3"
linux:
  target: [AppImage, deb, rpm, tar.gz]
  category: Game
  synopsis: Multiplayer TTRPG campaigns with an AI or human Dungeon Master
  artifactName: ${name}-${version}-${arch}.${ext}
# Built separately in CI via --linux flatpak (needs flatpak-builder plus the
# freedesktop runtime and Electron base app installed); not part of the
# default linux target list so dist:linux keeps working without them.
flatpak:
  runtimeVersion: "24.08"
  baseVersion: "24.08"
mac:
  target: [dmg, zip]
  category: public.app-category.games
  # Space-free and arch-qualified: GitHub sanitizes spaces in asset names
  # server-side, which broke electron-builder's upload conflict handling,
  # and the two mac arch jobs must not collide on asset names.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
# NSIS installer only; a portable exe would double the Windows downloads and
# the installer is what latest.yml / the in-app updater track.
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
