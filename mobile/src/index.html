<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Dark before the stylesheets arrive: a reload (the View menu, F5, the
       table screen opening) otherwise paints Chromium's white page for a
       frame or two before style.css lands, a white flicker on Windows. The
       colour is --background in style.css. -->
  <meta name="color-scheme" content="dark">
  <style>html { background: #0a0817; color-scheme: dark; }</style>
  <!-- The shell's own page, like the desktop's (src/renderer/index.html):
       its scripts come from the app only, pictures and sound from any
       host, and calls go to hosts over http(s) or sockets. Inline script is
       allowed because Capacitor injects its native bridge into this page
       as an inline script. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' https: http: ws: wss:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0817">
  <title>Open Dungeon Master</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./controls.css">
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <!-- Dust motes under the stars and the topographic lines, as on the
       server (its layout lays the same layer). -->
  <div class="ambient-dust" aria-hidden="true"></div>
  <canvas id="topo" aria-hidden="true"></canvas>
  <div id="app"></div>
  <script src="./bridge.js"></script>
  <script src="./topo.js"></script>
  <script src="./app.js"></script>
</body>
</html>
