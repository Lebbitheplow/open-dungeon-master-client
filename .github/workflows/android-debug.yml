# Temporary: diagnoses the release APK signing failure in isolation.
# Delete once the android job in release.yml is green.
name: android-debug
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: npm run sync
      - name: Decode and verify the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          sha256sum "$RUNNER_TEMP/release.keystore"
          wc -c "$RUNNER_TEMP/release.keystore"
          echo "storepass length: ${#STOREPASS}, alias length: ${#ALIAS}"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STOREPASS" -alias "$ALIAS"
      - name: Build the signed APK with stacktrace
        working-directory: mobile/android
        env:
          ODM_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ODM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ODM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace
