# Builds and publishes every release artifact to the GitHub release for the
# pushed tag: Linux (AppImage, deb, rpm, tar.gz), Windows (NSIS installer),
# macOS (dmg, zip; signed ad hoc until we have an Apple Developer
# identity, so Gatekeeper warns and auto-update stays off there), a flatpak
# bundle, and the signed Android APK. The in-app updater reads latest.yml
# (NSIS) and latest-linux.yml (AppImage) straight from the release assets.
#
# Run by hand on a branch (workflow_dispatch) it is a dry run: everything
# builds and the Mac checks run, but nothing is uploaded to a release.
#
# The server payload is built once from the sibling server repo and shared
# as an artifact; each desktop platform then rebuilds the native
# better-sqlite3 module for its own OS before packaging. The payload job
# picks the server commit once and every other job checks out that same
# commit, so a server push during the release cannot pair one revision's
# API with another's screens; each job checks the payload says so too.
# Android signing needs the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS repo secrets.
#
# electron-builder publishes to a draft release; the final publish job flips
# it live once every required artifact is uploaded, as a beta while the
# repository variable PUBLISH_AS_BETA is true: every tag then ships first as
# a GitHub prerelease, and one that holds up is promoted to stable by hand
# with `gh release edit vX.Y.Z --prerelease=false --latest`
# (docs/releases.md in the server repository). Stable installs only ever see
# GitHub's latest release, which is never a prerelease. With the variable
# unset, every tag goes out as the latest release, as before the channels.
#
# Which server it bundles: a tag on main is a beta and takes the server's
# newest release, beta or stable; a tag off main (a fix on a release/x.y
# branch) takes the server's latest stable release. Either way the apps
# carry a released server, never unreleased commits, so a client promoted to
# stable carries a server that was. A dry run takes the server's main, or
# the branch or tag it is given.
#
# Actions are pinned to the commit their major tag named, the same ones
# ci.yml uses.
#
# Before the draft goes live: the Windows installer is installed over the
# previous release on a clean runner and its world must come back whole
# (windows-install), and the signed Android APK must start on an emulator
# (android-launch). Every file a tag publishes gets a build provenance
# attestation, which `gh attestation verify <file> --repo
# Lebbitheplow/open-dungeon-master-client` checks; the downloads are not
# code signed, so this is how a player can tell one came from this build.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      server_ref:
        description: "Server branch or tag to bundle (default: the server's main)"
        required: false
        type: string

# The renderer bundles the server's own page components (the app's native
# game screens, scripts/build-renderer.mjs), so every job that builds the
# renderer checks the server repo out beside the client.
env:
  ODM_SERVER_DIR: ${{ github.workspace }}/open-dungeon-master

# The default workflow token is read-only; creating the release and
# uploading assets needs contents write.
permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  payload:
    runs-on: ubuntu-latest
    outputs:
      server_sha: ${{ steps.server.outputs.sha }}
      server_ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: client
      - name: The server release this build bundles
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_REPO: Lebbitheplow/open-dungeon-master
          WANTED: ${{ inputs.server_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            ref="${WANTED:-main}"
          else
            # identical or behind: the tagged commit is on main.
            on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            case "$on_main" in
              identical|behind)
                # Versions are plain x.y.z, so sort -V orders them.
                ref=$(gh release list --repo "$SERVER_REPO" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -1) ;;
              *)
                ref=$(gh release view --repo "$SERVER_REPO" --json tagName --jq .tagName) ;;
            esac
          fi
          if [ -z "$ref" ]; then
            echo "::error::found no server release to bundle"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Bundles server $ref" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ steps.pick.outputs.ref }}
          # bundle-server.mjs creates a worktree from HEAD, so it needs real
          # history, not a shallow grafted checkout.
          fetch-depth: 0
      - name: The server commit this release ships
        id: server
        run: echo "sha=$(git -C open-dungeon-master rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - name: Bundle the server payload
        working-directory: client
        env:
          ODM_SERVER_DIR: ${{ github.workspace }}/open-dungeon-master
        run: npm run bundle-server
      # This one Linux-built payload ships to Windows and macOS too. Until
      # server 0.24.6 the bundler compiled its Windows branches away, and the
      # Windows app could not find an installed agent program (issue 14).
      - name: The payload keeps its Windows code
        run: node open-dungeon-master/scripts/check-built-platform.mjs client/vendor/server/.next/server
      - name: Pack the payload without symlinks (Windows tar cannot extract
          them; each platform job recreates the module aliases)
        working-directory: client
        run: |
          find vendor/server -type l -delete
          tar -C vendor -czf server-payload.tgz server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-payload
          path: client/server-payload.tgz
          retention-days: 3

  desktop:
    needs: payload
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The payload job already rebuilt the native module for Linux. Every
  # platform then stages vendor/server as vendor/desktop
  # (scripts/stage-desktop-payload.mjs) for electron-builder.
          - os: ubuntu-latest
            args: --linux
            rebuild: false
          - os: windows-latest
            args: --win
            rebuild: true
          - os: macos-latest
            args: --mac --arm64
            rebuild: true
          - os: macos-15-intel
            args: --mac --x64
            rebuild: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ needs.payload.outputs.server_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-payload
      - name: Unpack the server payload and recreate the module aliases
        run: |
          mkdir -p vendor && tar -C vendor -xzf server-payload.tgz
          node scripts/alias-server-modules.mjs
      - name: The payload and these screens come from the same server commit
        run: |
          built=$(node -p "require('./vendor/server/odm-payload.json').commit")
          here=$(git -C open-dungeon-master rev-parse HEAD)
          case "$here" in
            "$built"*) echo "server $here" ;;
            *) echo "::error::payload is server $built, screens are server $here"; exit 1 ;;
          esac
      - name: Rebuild the native module for this platform
        if: matrix.rebuild == true
        run: >
          npx electron-rebuild
          --version "$(node -p "require('electron/package.json').version")"
          --module-dir vendor/server --force
          --only better-sqlite3-multiple-ciphers
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No Apple identity yet: electron-builder.yml signs ad hoc, and a
          # stray keychain identity on the runner must not be picked up.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >
          npm run build && node scripts/stage-desktop-payload.mjs &&
          npx electron-builder ${{ matrix.args }}
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - name: Keep the Windows installer for the install check
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 3
      - name: The files this build publishes
        id: built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "files<<EOF"
            ls release/*.exe release/*.AppImage release/*.deb release/*.rpm release/*.tar.gz release/*.dmg release/*-mac.zip 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Attest where they were built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.built.outputs.files }}
      # The local AI installer sizes its models from a PowerShell scan of the
      # display adapters; only a Windows machine can say whether it runs.
      - name: Check the graphics memory scan runs on Windows
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern "Windows adapter scan" tests/local-ai.test.mjs
      # 0.15.1 and earlier shipped with no signature at all and would not open
      # once downloaded. A failure here leaves the release a draft.
      - name: Check the Mac app is signed and starts
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d release/mac*/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Signature|CodeDirectory)'
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Open Dungeon Master" \
            -e 'console.log("electron", process.versions.electron, process.arch)'

  flatpak:
    needs: payload
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Best effort: a flatpak-builder or runtime hiccup should not block the
    # release of everything else.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ needs.payload.outputs.server_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install flatpak-builder and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-payload
      - name: Unpack the server payload and recreate the module aliases
        run: |
          mkdir -p vendor && tar -C vendor -xzf server-payload.tgz
          node scripts/alias-server-modules.mjs
      - name: The payload and these screens come from the same server commit
        run: |
          built=$(node -p "require('./vendor/server/odm-payload.json').commit")
          here=$(git -C open-dungeon-master rev-parse HEAD)
          case "$here" in
            "$built"*) echo "server $here" ;;
            *) echo "::error::payload is server $built, screens are server $here"; exit 1 ;;
          esac
      - name: Build and publish the flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          npm run build && node scripts/stage-desktop-payload.mjs &&
          npx electron-builder --linux flatpak
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - name: Attest where the bundle was built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/*.flatpak

  android:
    # Runs after a desktop job so the draft release already exists for the
    # APK upload. The phone hosts worlds itself: the APK carries the same
    # server payload (minus native modules) plus a Node runtime built for
    # Android, published once as a release of its own (see
    # mobile/scripts/build-node-android.sh) and fetched here by tag; likewise
    # cloudflared for Android (mobile/scripts/build-cloudflared-android.sh),
    # which shares the device's world on the internet.
    needs: [payload, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NODE_ANDROID_RELEASE: node-android-v24.20.0
      CLOUDFLARED_ANDROID_RELEASE: cloudflared-android-2026.8.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ needs.payload.outputs.server_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-payload
      - name: Unpack the server payload and recreate the module aliases
        run: |
          mkdir -p vendor && tar -C vendor -xzf server-payload.tgz
          node scripts/alias-server-modules.mjs
      - name: The payload and these screens come from the same server commit
        run: |
          built=$(node -p "require('./vendor/server/odm-payload.json').commit")
          here=$(git -C open-dungeon-master rev-parse HEAD)
          case "$here" in
            "$built"*) echo "server $here" ;;
            *) echo "::error::payload is server $built, screens are server $here"; exit 1 ;;
          esac
      # Both run as native code inside the APK, so each tarball must be the
      # one mobile/runtime.sha256 names before it is unpacked: a release
      # asset replaced since stops the build here. A new runtime release
      # changes the tag above and its line in that file together.
      - name: Fetch the Node runtime and cloudflared for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mobile/runtime
          gh release download "$NODE_ANDROID_RELEASE" --pattern '*.tar.gz' --dir mobile/runtime
          gh release download "$CLOUDFLARED_ANDROID_RELEASE" --pattern '*.tar.gz' --dir mobile/runtime
          (cd mobile/runtime && sha256sum --strict -c ../runtime.sha256)
          tar -C mobile/runtime -xzf "mobile/runtime/$NODE_ANDROID_RELEASE.tar.gz"
          tar -C mobile/runtime -xzf "mobile/runtime/$CLOUDFLARED_ANDROID_RELEASE.tar.gz"
          ls mobile/runtime/node-android mobile/runtime/cloudflared-android
      # The web assets come first: the payload leaves out the art they
      # already carry, so the bundler reads their manifest.
      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: npm run sync
      - name: Stage the server payload and runtime into the app
        working-directory: mobile
        run: npm run bundle-payload
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/odm-release.keystore"
      - name: Build the signed APK and app bundle
        working-directory: mobile/android
        env:
          ODM_ANDROID_KEYSTORE: ${{ runner.temp }}/odm-release.keystore
          ODM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ODM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # --stacktrace: Gradle hides the cause of a packaging failure
        # otherwise, and the runner cannot be inspected after the fact.
        # The APK is the GitHub download for sideloaders, built for arm64
        # only (app/build.gradle splits per ABI; the x86_64 one is for the
        # emulator); Google Play only accepts the bundle (.aab), which it
        # splits per device on install.
        run: |
          df -h . | tail -1
          free -m | head -2
          ./gradlew assembleRelease bundleRelease --stacktrace
      # The plugin classes and bridge methods Capacitor reaches by
      # reflection, checked in the signed, minified APK's own dex.
      - name: R8 kept what the plugin bridge calls by name
        run: node mobile/scripts/check-r8-keeps.mjs mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - name: Keep the x86_64 APK for the emulator launch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-x86_64-apk
          path: mobile/android/app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 3
      - name: Upload the APK and app bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A stale version file once pointed gh at the previous tag, so the
          # APK and bundle quietly clobbered a release that had already
          # shipped. Refuse to upload anywhere but the tag being built.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          cp mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "open-dungeon-master-client-$version.apk"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab \
            "open-dungeon-master-client-$version.aab"
          gh release upload "v$version" \
            "open-dungeon-master-client-$version.apk" \
            "open-dungeon-master-client-$version.aab" --clobber
      - name: Attest where they were built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            open-dungeon-master-client-*.apk
            open-dungeon-master-client-*.aab

  # The NSIS installer this run built, installed silently over the release
  # before it on a clean Windows runner: the previous version starts its
  # world and leaves a mark in the run tree's data folder, the new one must
  # bring back the same world with the mark and every module alias reaching
  # its package (client issue 49, server issue 280, both Windows-only and
  # both missed until players upgraded). Then a fresh profile, then the app
  # itself opening. scripts/smoke-installed.mjs says what each step checks.
  windows-install:
    needs: desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: new
      - name: Fetch the installer of the release before this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName -q '.[].tagName' | grep -vx "${GITHUB_REF_NAME}" | head -n 1)
          echo "previous release: $previous"
          gh release download "$previous" --pattern 'Open-Dungeon-Master-Setup-*.exe' --dir previous
      - name: Install the previous release and start its world
        run: |
          node scripts/smoke-installed.mjs install previous/Open-Dungeon-Master-Setup-*.exe "$RUNNER_TEMP/odm"
          node scripts/smoke-installed.mjs world "$RUNNER_TEMP/odm/Open Dungeon Master.exe" seed "$RUNNER_TEMP/odm-world"
      - name: Install this build over it; the same world comes back whole
        # The artifact keeps electron-builder's own name, "Open Dungeon Master
        # Setup x.y.z.exe"; only the release asset is renamed with dashes.
        run: |
          node scripts/smoke-installed.mjs install new/*Setup*.exe "$RUNNER_TEMP/odm"
          node scripts/smoke-installed.mjs world "$RUNNER_TEMP/odm/Open Dungeon Master.exe" verify "$RUNNER_TEMP/odm-world"
      - name: A world in an empty profile starts on this build
        run: node scripts/smoke-installed.mjs world "$RUNNER_TEMP/odm/Open Dungeon Master.exe" start "$RUNNER_TEMP/odm-fresh"
      - name: The installed app opens and stays up
        run: node scripts/smoke-installed.mjs launch "$RUNNER_TEMP/odm/Open Dungeon Master.exe"

  # The signed, minified x86_64 APK this run built, installed on an
  # emulator and started: what debug builds and unit tests never run.
  android-launch:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-x86_64-apk
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/launch-on-emulator.sh app-x86_64-release.apk

  # The checks a pull request gets (.github/workflows/ci.yml), against the
  # server commit this release ships. A failure leaves the release a draft.
  checks:
    needs: payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ needs.payload.outputs.server_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - name: Build and test the desktop app
        run: npm test
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Type check and test the mobile app
        working-directory: mobile
        run: npm run typecheck && npm test
      - name: Android unit tests
        run: cd mobile && npm run sync && cd android && ./gradlew testDebugUnitTest --stacktrace

  publish:
    needs: [payload, checks, desktop, flatpak, android, windows-install, android-launch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # The flatpak job may fail without holding the release back. Its
      # installs are then not offered this version (src/main/updater.ts
      # releaseHasAsset), and the run says so here.
      - name: Say when the release has no flatpak bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bundles=$(gh release view "${GITHUB_REF_NAME}" --json assets -q '[.assets[].name | select(endswith(".flatpak"))] | length')
          if [ "$bundles" = 0 ]; then
            echo "::warning::${GITHUB_REF_NAME} has no flatpak bundle; flatpak installs are not offered this version until one is uploaded."
          fi
      # Live as a beta once the repository variable PUBLISH_AS_BETA is true
      # (gh variable set PUBLISH_AS_BETA --body true); until then as the
      # latest release, the way every release went out before the channels.
      # The body names the server it bundles until release notes replace it,
      # so promotion can pair it with that server release.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER_REF: ${{ needs.payload.outputs.server_ref }}
          PUBLISH_AS_BETA: ${{ vars.PUBLISH_AS_BETA }}
        run: |
          notes=()
          if [ -z "$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)" ]; then
            notes=(--notes "Bundles server ${SERVER_REF}.")
          fi
          if [ "$PUBLISH_AS_BETA" = true ]; then
            channel=(--prerelease --latest=false)
          else
            channel=(--latest)
          fi
          gh release edit "${GITHUB_REF_NAME}" --draft=false "${channel[@]}" "${notes[@]}"
