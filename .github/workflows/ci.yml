# Checks every pull request and every push to main: lint, the desktop
# build and its tests, the mobile tests and type check, the main process's
# file-handling tests on Windows, and the Android unit tests (PayloadStore
# recovery, the local asset index). The release workflow runs the same
# checks before a release goes live.
#
# The renderer bundles the server's page components, so the server repo is
# checked out beside the client at its default branch: a client change has
# to work with the server it will ship against. A pull request whose branch
# has a server branch of the same name (the server half of the same work,
# not merged yet) is built against that branch instead, so a paired change
# is tested with the server it needs; pushes to main always use the
# server's main, as the release workflow does.
#
# Actions are pinned to the commit their v4 tag named when this was written.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ODM_SERVER_DIR: ${{ github.workspace }}/open-dungeon-master

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the server branch
        id: server
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads https://github.com/Lebbitheplow/open-dungeon-master.git "refs/heads/$HEAD_REF" >/dev/null; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "Building against the server branch $HEAD_REF"
          else
            echo "Building against the server's default branch"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ steps.server.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - name: Build and test the desktop app
        run: npm test
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Type check the mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Test the mobile app
        working-directory: mobile
        run: npm test

  # The payload swap, the run tree, the stale-server reaper and the repair
  # meet what only Windows has: files held for a moment after their process
  # is gone, paths compared without case, a process list read through
  # PowerShell. Their tests run there too, on the main process alone, since
  # they need nothing of the renderer or the server checkout.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the main process
        run: npx tsc -p tsconfig.main.json
      - name: Test the payload store, the run tree, the manifest, the device world and the reaper
        run: >-
          node --test
          tests/payload-store.test.mjs
          tests/payload-manifest.test.mjs
          tests/run-tree.test.mjs
          tests/stale-server.test.mjs
          tests/local-server.test.mjs
          tests/reset.test.mjs
          tests/diagnostics.test.mjs
          tests/prune-server-payload.test.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the server branch
        id: server
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads https://github.com/Lebbitheplow/open-dungeon-master.git "refs/heads/$HEAD_REF" >/dev/null; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "Building against the server branch $HEAD_REF"
          else
            echo "Building against the server's default branch"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
          ref: ${{ steps.server.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: npm run sync
      - name: Android unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --stacktrace
