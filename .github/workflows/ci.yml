# Checks every pull request and every push to main: lint, the desktop
# build and its tests, the mobile tests and type check, and the Android
# unit tests (PayloadStore recovery, the local asset index). The release
# workflow runs the same checks before a release goes live.
#
# The renderer bundles the server's page components, so the server repo is
# checked out beside the client at its default branch: a client change has
# to work with the server it will ship against.
#
# Actions are pinned to the commit their v4 tag named when this was written.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ODM_SERVER_DIR: ${{ github.workspace }}/open-dungeon-master

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - name: Build and test the desktop app
        run: npm test
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Type check the mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Test the mobile app
        working-directory: mobile
        run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lebbitheplow/open-dungeon-master
          path: open-dungeon-master
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: npm run sync
      - name: Android unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --stacktrace
