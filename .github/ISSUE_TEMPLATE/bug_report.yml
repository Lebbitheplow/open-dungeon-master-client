name: App bug
description: Something in the desktop or Android app itself is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the app itself: installing or updating it, its title screen and Settings, sharing your world, and the local story or image AI it installs. A bug in the game screens, the rules or the AI Dungeon Master goes to the [main repository's bug form](https://github.com/Lebbitheplow/open-dungeon-master/issues/new?template=bug_report.yml). Questions about setting things up go to [Q&A in Discussions](https://github.com/Lebbitheplow/open-dungeon-master/discussions/categories/q-a) or [Discord](https://discord.gg/B2tQFr3TYD), where other players can help.

        **Playing on someone else's server?** Tell whoever runs it first. Most problems come from how a server is set up, and they can check that.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I am on the latest app release.
          required: true
        - label: I searched the open and closed issues here and in the main repository, and this is not one of them.
          required: true
        - label: This is the app itself, not the game screens, the rules or the AI Dungeon Master.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you were doing just before. Paste any error message you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps from opening the app. If it happened once and you cannot make it happen again, say exactly what you were doing.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      value: |
        - App version (App settings):
        - Desktop (Windows, macOS or Linux, and which) or Android (which phone):
        - Playing in your own world, or on someone else's server:
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Diagnostics summary and screenshots
      description: In the app, Settings > Troubleshooting > Copy summary, then paste it here. It names no accounts, keys or campaign text. Add any screenshots.
